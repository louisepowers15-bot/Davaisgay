<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Football Tips · Gold</title>
  <style>
    :root {
      --bg: #050505;
      --panel: #0e0e0e;
      --panel2: #161616;
      --border: #2a2410;
      --gold: #d4af37;
      --gold2: #f0d060;
      --gold-dim: #8a7330;
      --text: #f5f5f5;
      --muted: #a3a3a3;
      --skip: #6b7280;
      --win: #4ade80;
      --lose: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }
    .wrap { max-width: 980px; margin: 0 auto; padding: 1rem 1rem 3rem; }
    header {
      text-align: center;
      padding: 1.25rem 0 0.75rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 1rem;
    }
    header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--gold2);
      text-shadow: 0 0 24px rgba(212, 175, 55, 0.25);
    }
    header p { color: var(--muted); font-size: 0.88rem; margin-top: 0.35rem; }

    /* Main tabs */
    .main-tabs {
      display: flex; flex-wrap: wrap; gap: 0.45rem;
      margin: 1rem 0 1.1rem;
      justify-content: center;
    }
    .main-tab {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--gold-dim);
      padding: 0.55rem 1.05rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      transition: 0.15s ease;
    }
    .main-tab:hover { border-color: var(--gold); color: var(--gold2); }
    .main-tab.active {
      background: linear-gradient(180deg, #3a3010, #1a1508);
      border-color: var(--gold);
      color: var(--gold2);
      box-shadow: 0 0 16px rgba(212, 175, 55, 0.2);
    }

    /* League list under a tab */
    .league {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 0.55rem;
      overflow: hidden;
    }
    .league-head {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.95rem 1.1rem;
      cursor: pointer;
      font-weight: 600;
      background: var(--panel2);
      user-select: none;
    }
    .league-head:hover { background: #1c1c1c; }
    .league-head .count {
      color: var(--gold-dim); font-weight: 500; font-size: 0.82rem;
    }
    .league-head .chev {
      color: var(--gold); transition: transform 0.2s; margin-left: 0.5rem;
    }
    .league.open .chev { transform: rotate(90deg); }
    .league-body { display: none; border-top: 1px solid var(--border); }
    .league.open .league-body { display: block; }

    /* Match row */
    .match {
      border-bottom: 1px solid #1a1a1a;
      padding: 0.85rem 1rem;
    }
    .match:last-child { border-bottom: none; }
    .match-row {
      display: flex; flex-wrap: wrap; gap: 0.4rem 0.85rem;
      align-items: center; cursor: pointer;
    }
    .kick {
      color: var(--gold); font-weight: 700; font-size: 0.9rem; min-width: 3.1rem;
    }
    .vs-name { font-weight: 600; font-size: 0.98rem; flex: 1; min-width: 140px; }
    .pred {
      font-size: 0.82rem; font-weight: 700;
      padding: 0.25rem 0.65rem; border-radius: 6px;
      border: 1px solid var(--gold-dim);
      color: var(--gold2);
      background: #1a1608;
      white-space: nowrap;
    }
    .pred.skip {
      border-color: #333; color: var(--skip); background: #111; font-weight: 500;
    }
    .pred.strong { border-color: var(--gold); box-shadow: 0 0 8px rgba(212,175,55,0.25); }
    .conf-mini { color: var(--muted); font-size: 0.78rem; }

    /* Expanded match detail */
    .match-detail {
      display: none;
      margin-top: 0.75rem;
      padding: 0.85rem;
      background: #0a0a0a;
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .match.open .match-detail { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      margin-bottom: 0.85rem;
    }
    @media (max-width: 560px) {
      .stats-grid { grid-template-columns: 1fr; }
    }
    .stat-card {
      background: var(--panel2);
      border: 1px solid #222;
      border-radius: 8px;
      padding: 0.65rem 0.75rem;
    }
    .stat-card h4 {
      color: var(--gold); font-size: 0.8rem; margin-bottom: 0.35rem;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .stat-card .row {
      display: flex; justify-content: space-between;
      font-size: 0.84rem; padding: 0.15rem 0; color: #ddd;
    }
    .stat-card .row span:last-child { color: var(--gold2); font-weight: 600; }
    .stat-note { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }

    .scoreline-box {
      border: 1px solid var(--gold-dim);
      background: linear-gradient(90deg, #1a1508, #0e0e0e);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.75rem;
    }
    .scoreline-box .lbl { font-size: 0.72rem; color: var(--gold-dim); text-transform: uppercase; }
    .scoreline-box .val { font-size: 1.25rem; font-weight: 700; color: var(--gold2); }

    .builder {
      border: 1px dashed var(--gold-dim);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 0.65rem;
    }
    .builder h4 {
      color: var(--gold); font-size: 0.78rem; text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 0.4rem;
    }
    .builder li { margin-left: 1.1rem; margin-bottom: 0.25rem; font-size: 0.88rem; color: #e5e5e5; }
    .builder .disc { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }

    .bot-tip {
      border-top: 1px solid #1a1a1a;
      padding: 0.5rem 0;
      font-size: 0.86rem;
      cursor: pointer;
    }
    .bot-tip .bot-name { color: var(--gold); font-weight: 700; font-size: 0.78rem; }
    .bot-tip .reason {
      display: none; margin-top: 0.35rem; color: var(--muted); font-size: 0.84rem;
    }
    .bot-tip.open .reason { display: block; }

    .section-title {
      color: var(--gold2); font-size: 1.05rem; font-weight: 700;
      margin: 0.5rem 0 0.85rem; letter-spacing: 0.03em;
    }
    .empty {
      text-align: center; color: var(--muted); padding: 2.5rem 1rem; font-size: 0.95rem;
    }
    .hint {
      text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 0.85rem;
    }

    /* Leaderboard */
    .lb-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    .lb-table th, .lb-table td {
      padding: 0.55rem 0.45rem; border-bottom: 1px solid #222; text-align: left;
    }
    .lb-table th { color: var(--gold-dim); font-size: 0.75rem; text-transform: uppercase; }
    .lb-table tr.best { background: rgba(212, 175, 55, 0.08); }
    .pos { color: var(--win); font-weight: 700; }
    .neg { color: var(--lose); font-weight: 700; }
    .lb-cards { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-bottom: 1rem; }
    .lb-card {
      flex: 1; min-width: 130px; background: var(--panel);
      border: 1px solid var(--border); border-radius: 10px; padding: 0.7rem 0.85rem;
    }
    .lb-card .lbl { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
    .lb-card .val { color: var(--gold2); font-weight: 700; font-size: 1.05rem; margin-top: 0.2rem; }

    .form-block { margin-top: 0.45rem; }
    .form-toggle {
      cursor: pointer; color: var(--gold); font-size: 0.78rem; font-weight: 600;
      margin-top: 0.35rem; user-select: none;
    }
    .form-lines { display: none; margin-top: 0.4rem; font-size: 0.8rem; }
    .form-lines.open { display: block; }
    .form-line {
      display: grid; grid-template-columns: 4.2rem 1.2rem 1fr 2.4rem 1.2rem;
      gap: 0.25rem; padding: 0.22rem 0; border-bottom: 1px solid #1a1a1a; color: #ccc;
    }
    .form-line .res-W { color: #4ade80; font-weight: 700; }
    .form-line .res-D { color: #fbbf24; font-weight: 700; }
    .form-line .res-L { color: #f87171; font-weight: 700; }
    .form-line .tag { color: var(--gold-dim); font-size: 0.72rem; grid-column: 1 / -1; padding-left: 0.2rem; }
    footer {
      text-align: center; color: #555; font-size: 0.75rem; margin-top: 2.5rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>FOOTBALL TIPS</h1>
      <p>UK · Europe · Cups · UEFA · International · Leaderboard</p>
    </header>

    <div class="main-tabs" id="main-tabs">
      <button class="main-tab active" data-tab="uk">🇬🇧 UK</button>
      <button class="main-tab" data-tab="europe">🇪🇺 Europe</button>
      <button class="main-tab" data-tab="cups">🏆 Cups</button>
      <button class="main-tab" data-tab="uefa">⭐ UEFA</button>
      <button class="main-tab" data-tab="international">🌍 International</button>
      <button class="main-tab" data-tab="leaderboard">🏅 Leaderboard</button>
    </div>
    <p class="hint" id="hint">Tap a league → games · Tap a game → stats, scoreline &amp; bet builder · Tight games are skipped</p>
    <div id="content"><p class="empty">Loading…</p></div>
    <footer>Not betting advice · 18+ · Gamble responsibly</footer>
  </div>

<script>
const TAB_ORDER = {
  uk: ["Premier League", "Championship", "League One", "League Two", "National League", "Scottish Premiership", "Scottish Championship"],
  europe: ["La Liga", "Serie A", "Bundesliga", "Ligue 1", "Eredivisie", "Primeira Liga"],
  cups: ["FA Cup", "EFL Cup", "EFL Trophy", "Scottish Cup", "Scottish League Cup"],
  uefa: ["Champions League", "Europa League", "Conference League"],
  international: [],
};

let todayData = null;
let tomorrowData = null;
let leaderboardData = null;
let currentTab = "uk";

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function localISO(d) {
  return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
}
function isoToday() { return localISO(new Date()); }
function isoTomorrow() {
  const d = new Date(); d.setDate(d.getDate() + 1); return localISO(d);
}

async function loadJSON(name) {
  for (const p of ["./" + name, name]) {
    try {
      const r = await fetch(p + "?t=" + Date.now());
      if (r.ok) return await r.json();
    } catch (e) {}
  }
  return null;
}

function leaguesForTab(data, tab) {
  if (!data || !data.leagues) return [];
  const preferred = TAB_ORDER[tab] || [];
  const list = data.leagues.filter(lg => {
    const cat = lg.category || (
      preferred.includes(lg.name) ? tab :
      (lg.region === "UK" && tab === "uk") ? "uk" :
      (lg.region === "Europe" && tab === "europe") ? "europe" : null
    );
    if (tab === "uk") return cat === "uk" || preferred.includes(lg.name);
    if (tab === "europe") return cat === "europe" || preferred.includes(lg.name);
    if (tab === "cups") return cat === "cups" || preferred.includes(lg.name);
    if (tab === "uefa") return cat === "uefa" || preferred.includes(lg.name);
    if (tab === "international") return cat === "international";
    return false;
  });
  // sort by preferred order
  list.sort((a, b) => {
    const ia = preferred.indexOf(a.name); const ib = preferred.indexOf(b.name);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return list;
}

function renderMatch(m) {
  const cons = m.consensus || {};
  const tippable = m.tippable !== false && cons.tippable !== false && cons.pick;
  const strength = cons.strength || "skip";
  const predCls = tippable ? ("pred " + (strength === "strong" ? "strong" : "")) : "pred skip";
  const predText = tippable
    ? (cons.pick_label || "—") + (cons.odds != null ? "  ·  " + cons.odds : "")
    : "No tip — too tight";

  let html = '<div class="match" onclick="toggleMatch(event, this)">';
  html += '<div class="match-row">';
  html += '<span class="kick">' + (m.kickoff || "") + "</span>";
  html += '<span class="vs-name">' + (m.name || "") + "</span>";
  html += '<span class="' + predCls + '">' + predText + "</span>";
  if (tippable && cons.avg_conf) {
    html += '<span class="conf-mini">' + cons.avg_conf + "% · " + (cons.bot_count || 0) + " bots</span>";
  }
  html += "</div>";

  // detail
  html += '<div class="match-detail" onclick="event.stopPropagation()">';
  if (m.venue) html += '<div style="color:var(--muted);font-size:0.8rem;margin-bottom:0.5rem">' + m.venue + "</div>";

  // stats
  const st = m.stats || {};
  html += '<div class="stats-grid">';
  function formLines(list, title) {
    if (!list || !list.length) return "";
    let h = '<div class="form-block"><div class="form-toggle" onclick="event.stopPropagation();this.nextElementSibling.classList.toggle(\'open\')">▶ ' + title + " (" + list.length + ")</div>";
    h += '<div class="form-lines">';
    list.forEach(r => {
      h += '<div class="form-line">';
      h += "<span>" + (r.date || "") + "</span>";
      h += "<span>" + (r.venue || "") + "</span>";
      h += "<span>" + (r.opponent || "") + "</span>";
      h += "<span>" + (r.ft || "") + "</span>";
      h += '<span class="res-' + (r.result || "") + '">' + (r.result || "") + "</span>";
      if (r.opp_label) h += '<span class="tag">' + r.opp_label + "</span>";
      if (r.red_cards) h += '<span class="tag">Red cards: ' + r.red_cards + "</span>";
      if (r.penalties) h += '<span class="tag">Penalties: ' + r.penalties + "</span>";
      h += "</div>";
    });
    h += "</div></div>";
    return h;
  }
  ["home", "away"].forEach(side => {
    const s = st[side] || {};
    html += '<div class="stat-card"><h4>' + (s.name || side) + "</h4>";
    html += '<div class="row"><span>Last 5 overall</span><span>' + (s.form_last5 || "—") + " (" + (s.form_last5_record || "") + ")</span></div>";
    html += '<div class="row"><span>Last 5 home</span><span>' + (s.home_form_last5 || "—") + " (" + (s.home_form_record || "") + ")</span></div>";
    html += '<div class="row"><span>Last 5 away</span><span>' + (s.away_form_last5 || "—") + " (" + (s.away_form_record || "") + ")</span></div>";
    if (s.unbeaten_last5) html += '<div class="row"><span></span><span style="color:var(--gold2)">Unbeaten last 5 overall</span></div>';
    html += '<div class="row"><span>Season W-D-L</span><span>' + (s.record || "—") + "</span></div>";
    html += '<div class="row"><span>Season win %</span><span>' + (s.win_pct != null ? s.win_pct + "%" : "—") + "</span></div>";
    html += '<div class="row"><span>Pts / game</span><span>' + (s.pts_pg != null ? s.pts_pg : "—") + "</span></div>";
    (s.flags || []).forEach(f => {
      html += '<div class="row"><span></span><span style="color:var(--gold2)">' + f + "</span></div>";
    });
    html += formLines(s.overall_matches, "Overall last 5 detail");
    html += formLines(s.home_matches, "Home last 5 detail");
    html += formLines(s.away_matches, "Away last 5 detail");
    if (s.note) html += '<div class="stat-note">' + s.note + "</div>";
    html += "</div>";
  });
  html += "</div>";

  if (tippable) {
    const bb = m.bet_builder || {};
    if (bb.scoreline) {
      html += '<div class="scoreline-box"><div class="lbl">Suggested scoreline</div><div class="val">' + bb.scoreline + "</div></div>";
    }
    if (bb.legs && bb.legs.length) {
      html += '<div class="builder"><h4>Bet builder</h4><ul>';
      bb.legs.forEach(leg => {
        html += "<li><b>" + leg.market + ":</b> " + leg.selection +
          (leg.note ? ' <span style="color:var(--muted)">(' + leg.note + ")</span>" : "") + "</li>";
      });
      html += "</ul>";
      if (bb.safer_alternative) html += '<div style="color:var(--muted);font-size:0.82rem">Safer: ' + bb.safer_alternative + "</div>";
      if (bb.disclaimer) html += '<div class="disc">' + bb.disclaimer + "</div>";
      html += "</div>";
    }
    (m.tips || []).forEach(t => {
      html += '<div class="bot-tip" onclick="this.classList.toggle(\'open\')">';
      html += '<span class="bot-name">' + t.bot + "</span> · " + (t.pick_label || t.pick) +
        " · " + (t.conf || "") + "%";
      html += '<div class="reason">' + (t.reason || "") + "</div></div>";
    });
  } else {
    html += '<p style="color:var(--skip);font-size:0.88rem">Bots are split or confidence is too low — no forced tip on this game.</p>';
  }

  html += "</div></div>";
  return html;
}

function renderLeagues(data, tab) {
  const leagues = leaguesForTab(data, tab);
  if (!leagues.length) {
    return '<p class="empty">No leagues in this section for today.<br>UK league games are mostly weekends; UEFA cups often midweek.</p>';
  }
  let html = "";
  leagues.forEach(lg => {
    const tipped = lg.tipped_count != null ? lg.tipped_count : (lg.matches || []).filter(m => m.tippable !== false && (m.consensus || {}).pick).length;
    const total = (lg.matches || []).length;
    html += '<div class="league">';
    html += '<div class="league-head" onclick="this.parentElement.classList.toggle(\'open\')">';
    html += "<span>" + lg.name + "</span>";
    html += '<span class="count">' + tipped + " tipped · " + total + " games <span class=\"chev\">▶</span></span>";
    html += "</div><div class=\"league-body\">";
    (lg.matches || []).forEach(m => { html += renderMatch(m); });
    html += "</div></div>";
  });
  return html;
}

function renderLeaderboard(lb) {
  if (!lb || !lb.bots) {
    return '<p class="empty">Leaderboard fills after evening results settle.</p>';
  }
  const bots = Object.entries(lb.bots).map(([name, st]) => ({ name, ...st }));
  bots.sort((a, b) => b.roi - a.roi);
  const cons = lb.consensus || {};
  let html = '<div class="section-title">Leaderboard</div>';
  html += '<p class="hint">Last settled ' + (lb.last_settled || "—") + " · £1 stakes</p>";
  html += '<div class="lb-cards">';
  html += '<div class="lb-card"><div class="lbl">Consensus</div><div class="val ' +
    ((cons.roi||0)>=0?"pos":"neg") + '">' + ((cons.roi||0)>=0?"+":"") + (cons.roi||0) + "%</div></div>";
  if (bots[0]) {
    html += '<div class="lb-card"><div class="lbl">Best ROI</div><div class="val">' + bots[0].name +
      '</div><div class="' + (bots[0].roi>=0?"pos":"neg") + '">' + (bots[0].roi>=0?"+":"") + bots[0].roi + "%</div></div>";
  }
  html += "</div>";
  html += '<table class="lb-table"><thead><tr><th>Bot</th><th>Tips</th><th>Win%</th><th>ROI</th><th>P&amp;L</th></tr></thead><tbody>';
  bots.forEach((b, i) => {
    html += '<tr' + (i===0?' class="best"':'') + '><td><strong>' + b.name + "</strong></td><td>" +
      b.tips + "</td><td>" + b.win_pct + '%</td><td class="' + (b.roi>=0?"pos":"neg") + '">' +
      (b.roi>=0?"+":"") + b.roi + '%</td><td class="' + (b.pnl>=0?"pos":"neg") + '">' +
      (b.pnl>=0?"+":"") + b.pnl + "</td></tr>";
  });
  html += "</tbody></table>";
  return html;
}

function toggleMatch(ev, el) {
  if (ev.target.closest(".match-detail")) return;
  el.classList.toggle("open");
}

function render() {
  const el = document.getElementById("content");
  const hint = document.getElementById("hint");
  if (currentTab === "leaderboard") {
    hint.style.display = "none";
    el.innerHTML = renderLeaderboard(leaderboardData);
    return;
  }
  hint.style.display = "";
  // Prefer today; if empty leagues for tab, still show today structure
  el.innerHTML = renderLeagues(todayData, currentTab);
}

document.getElementById("main-tabs").addEventListener("click", e => {
  const btn = e.target.closest(".main-tab");
  if (!btn) return;
  document.querySelectorAll(".main-tab").forEach(t => t.classList.remove("active"));
  btn.classList.add("active");
  currentTab = btn.getAttribute("data-tab");
  render();
});

(async function init() {
  const day = isoToday();
  todayData = await loadJSON("tips-" + day + ".json");
  tomorrowData = await loadJSON("tips-" + isoTomorrow() + ".json");
  leaderboardData = await loadJSON("leaderboard.json");
  // If today empty, try tomorrow for early evening browsing
  if ((!todayData || !(todayData.leagues || []).length) && tomorrowData && (tomorrowData.leagues || []).length) {
    todayData = tomorrowData;
  }
  render();
})();
</script>
</body>
</html>
